[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.28'
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_env = true
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./broadcast" },
]

remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    'forge-std/=lib/forge-std/src/',
]

[profile.fork]
auto_detect_env = true
# Choose one of the following fork configurations:
# Option 1: Fork from a public RPC endpoint
eth_rpc_url = "${ETH_RCP_URL}"

# Option 2: Fork from a local node
# eth_rpc_url = "http://localhost:8545"

# Set block number to fork from (optional)
#fork_block_number = 17000000

# Verbosity level
verbosity = 3

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
