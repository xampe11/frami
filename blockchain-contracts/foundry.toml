# =============================================================================
# FOUNDRY CONFIGURATION FOR PHASE 1 DEPLOYMENT
# =============================================================================

[profile.default]
# Directories
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
broadcast = "broadcast"

# Compiler settings
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"

# Testing
verbosity = 2
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 15 }

# Allow paths for file operations
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./deployments/" },
    { access = "read-write", path = "deployments/" },
    { access = "read-write", path = "deployments" },
    { access = "read-write", path = "./broadcast" },
    { access = "read-write", path = "./" },
    { access = "read-write", path = "../" },
    { access = "read-write", path = "../../front-end" },
]

# Gas settings
gas_limit = 9223372036854775807
gas_price = 20000000000         # 20 gwei
gas_reports = ["*"]

# Remappings for imports
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts",
]

# Auto-detect dependencies
auto_detect_solc = false
offline = false
no_storage_caching = false

# =============================================================================
# NETWORK CONFIGURATIONS
# =============================================================================

[rpc_endpoints]
# Mainnets
mainnet = "${MAINNET_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
base = "${BASE_RPC_URL}"

# Testnets
sepolia = "${SEPOLIA_RPC_URL}"
goerli = "${GOERLI_RPC_URL}"
mumbai = "${MUMBAI_RPC_URL}"
arbitrum_goerli = "${ARBITRUM_GOERLI_RPC_URL}"
optimism_goerli = "${OPTIMISM_GOERLI_RPC_URL}"
base_goerli = "${BASE_GOERLI_RPC_URL}"

# Local
localhost = "${LOCALHOST_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# =============================================================================
# ETHERSCAN VERIFICATION
# =============================================================================

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/api" }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
goerli = { key = "${ETHERSCAN_API_KEY}", url = "https://api-goerli.etherscan.io/api" }
polygon = { key = "${POLYGON_API_KEY}", url = "https://api.polygonscan.com/api" }
mumbai = { key = "${POLYGON_API_KEY}", url = "https://api-testnet.polygonscan.com/api" }
arbitrum = { key = "${ARBITRUM_API_KEY}", url = "https://api.arbiscan.io/api" }
arbitrum_goerli = { key = "${ARBITRUM_API_KEY}", url = "https://api-goerli.arbiscan.io/api" }
optimism = { key = "${OPTIMISM_API_KEY}", url = "https://api-optimistic.etherscan.io/api" }
optimism_goerli = { key = "${OPTIMISM_API_KEY}", url = "https://api-goerli-optimistic.etherscan.io/api" }
base = { key = "${BASE_API_KEY}", url = "https://api.basescan.org/api" }
base_goerli = { key = "${BASE_API_KEY}", url = "https://api-goerli.basescan.org/api" }

# =============================================================================
# DEPLOYMENT PROFILES
# =============================================================================

# Production deployment profile
[profile.production]
optimizer = true
optimizer_runs = 1000   # Higher optimization for production
via_ir = true           # Use IR pipeline for better optimization
gas_price = 15000000000 # 15 gwei - adjust based on network conditions

# Testnet deployment profile
[profile.testnet]
optimizer = true
optimizer_runs = 200
gas_price = 5000000000 # 5 gwei - lower for testnets

# Local development profile
[profile.local]
optimizer = false      # Faster compilation for local development
gas_price = 1000000000 # 1 gwei

# Gas testing profile
[profile.gas-test]
optimizer = true
optimizer_runs = 200
gas_reports = ["*"]
gas_limit = 30000000

# =============================================================================
# SPECIFIC NETWORK CONFIGURATIONS
# =============================================================================

# Ethereum Mainnet
[profile.mainnet]
optimizer = true
optimizer_runs = 1000
via_ir = true
gas_price = 20000000000 # Adjust based on current gas prices

# Sepolia Testnet
[profile.sepolia]
optimizer = true
optimizer_runs = 200
gas_price = 2000000000 # 2 gwei

# Polygon
[profile.polygon]
optimizer = true
optimizer_runs = 1000
gas_price = 50000000000 # 50 gwei in MATIC

# Arbitrum
[profile.arbitrum]
optimizer = true
optimizer_runs = 1000
gas_price = 1000000000 # 1 gwei

# Base
[profile.base]
optimizer = true
optimizer_runs = 1000
gas_price = 1000000000 # 1 gwei

# =============================================================================
# FORMATTING & LINTING
# =============================================================================

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"

# =============================================================================
# DOCUMENTATION
# =============================================================================

[doc]
out = "docs"
title = "Frami Platform - Phase 1 Contracts"
book = "book.toml"
ignore = ["test/**", "script/**"]

# =============================================================================
# DEPLOYMENT SETTINGS
# =============================================================================

# Default settings for contract deployment
[invariant]
runs = 256
depth = 15
fail_on_revert = false
call_override = false
dictionary_weight = 40
include_storage = true
include_push_bytes = true

# Fuzz testing settings
[fuzz]
runs = 256
max_test_rejects = 65536
seed = '0x3e8'
dictionary_weight = 40
include_storage = true
include_push_bytes = true

# =============================================================================
# SAFETY SETTINGS
# =============================================================================

# Security settings for safer deployments
[profile.security]
optimizer = true
optimizer_runs = 200
# Force specific Solidity version for consistency
solc = "0.8.28"
# Disable experimental features in production
via_ir = false
# Enable all warnings
ignored_error_codes = []

# =============================================================================
# CI/CD SETTINGS
# =============================================================================

# Configuration for continuous integration
[profile.ci]
optimizer = true
optimizer_runs = 200
fuzz = { runs = 512 }
invariant = { runs = 512, depth = 20 }
verbosity = 3
gas_reports = ["*"]
# Fail fast on first error
fail_fast = true

# =============================================================================
# COVERAGE SETTINGS
# =============================================================================

# Settings for test coverage reporting
[profile.coverage]
optimizer = false   # Disable optimization for accurate coverage
gas_reports = ["*"]
# Enable coverage for all contracts
coverage = true

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Memory limit for compilation (in MB)
memory_limit = 33554432 # 32 GB

# Allow paths for file operations
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./deployments/" },
    { access = "read-write", path = "deployments/" },
    { access = "read-write", path = "deployments" },
    { access = "read-write", path = "./broadcast" },
    { access = "read-write", path = "./" },
    { access = "read-write", path = "../" },
    { access = "read-write", path = "../../front-end" },
]


# FFI settings (be careful with this)
ffi = true # Required for some deployment scripts

# Library linking
libraries = []

# Build info
build_info = true
build_info_path = "out/build-info"

# Sparse mode for faster compilation
sparse_mode = false

# =============================================================================
# ENVIRONMENT VARIABLE FALLBACKS
# =============================================================================

# Default values if environment variables are not set
[profile.env]
LOCALHOST_RPC_URL = "http://127.0.0.1:8545"
ANVIL_RPC_URL = "http://127.0.0.1:8545"

# =============================================================================
# COMPILER WARNINGS
# =============================================================================

# Solidity compiler warnings to ignore
ignored_error_codes = [
    1878, # SPDX license identifier not provided
    3420, # Source file does not specify required compiler version
]

# Enable specific warnings
warnings = []

# =============================================================================
# MODEL CHECKER (EXPERIMENTAL)
# =============================================================================

# SMT checker settings (experimental feature)
[profile.model_checker]
contracts = {}
engine = "chc"
timeout = 20000
targets = [
    "assert",
    "underflow",
    "overflow",
    "divByZero",
    "constantCondition",
    "popEmptyArray",
    "outOfBounds",
]

# =============================================================================
# NOTES
# =============================================================================

# Additional configuration notes:
#
# 1. Gas Price Strategy:
#    - Adjust gas_price based on network conditions
#    - Consider using dynamic gas pricing for production
#    - Monitor gas usage during deployment
#
# 2. Optimization:
#    - Higher optimizer_runs for production (gas efficiency)
#    - Lower optimizer_runs for development (faster compilation)
#    - Enable via_ir for maximum optimization in production
#
# 3. Security:
#    - Always use specific Solidity version in production
#    - Enable all warnings and fix them before deployment
#    - Test with different optimization levels
#
# 4. RPC Endpoints:
#    - Use reliable providers for production deployments
#    - Have backup RPC endpoints ready
#    - Monitor rate limits and usage
#
# 5. Verification:
#    - Ensure API keys are valid for contract verification
#    - Test verification on testnet first
#    - Keep constructor arguments for manual verification if needed
