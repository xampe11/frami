# User entity (enhanced)
type User @entity(immutable: false) {
  id: Bytes!
  totalNFTsOwned: Int!
  totalNFTsStaked: Int!
  totalRewardsEarned: BigDecimal!
  totalRewardsClaimed: BigDecimal!

  # Relationships
  nfts: [FounderNFT!]! @derivedFrom(field: "currentOwner")
  stakingHistory: [StakeEvent!]! @derivedFrom(field: "user")
  rewardsClaimed: [RewardClaim!]! @derivedFrom(field: "user")
  analytics: UserAnalytics
  feeAnalytics: UserFeeAnalytics

  # Timestamps
  firstInteraction: BigInt!
  lastInteraction: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

# FounderNFT entity (enhanced)
type FounderNFT @entity(immutable: false) {
  id: Bytes!
  tokenId: BigInt!
  currentOwner: User!
  mintedBy: User!
  isStaked: Boolean!
  currentStaker: User
  stakingSince: BigInt
  totalRewardsEarned: BigDecimal!
  totalRewardsClaimed: BigDecimal!

  # NEW: Real-time reward fields
  pendingRewards: BigDecimal!
  lastRewardCalculation: BigInt!
  rewardAccumulationRate: BigDecimal!
  claimableAmount: BigDecimal!

  # Existing computed fields
  canUnstake: Boolean!
  nextUnstakeDate: BigInt
  stakingDuration: BigInt
  lastRewardUpdate: BigInt!

  # Relationships
  stakingHistory: [StakeEvent!]! @derivedFrom(field: "nft")
  rewardsClaimed: [RewardClaim!]! @derivedFrom(field: "nft")

  # Timestamps
  mintedAt: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

# NEW: Platform configuration
type PlatformConfig @entity(immutable: false) {
  id: Bytes!
  minimumStakingPeriod: BigInt!
  baseAPR: BigDecimal!
  performanceMultiplier: BigDecimal!
  rewardCalculationPeriod: BigInt!
  maxStakeAmount: BigInt!
  emergencyWithdrawEnabled: Boolean!
  lastConfigUpdate: BigInt!
}

# NEW: User analytics
type UserAnalytics @entity(immutable: false) {
  id: Bytes!
  user: User!
  averageStakingDuration: BigDecimal!
  totalTransactions: Int!
  stakingStreak: Int!
  longestStakingStreak: Int!
  rewardEfficiency: BigDecimal!
  riskProfile: String!
  lastActivityDate: BigInt!
  membershipTier: String!
}

# NEW: Fee tracking
type FeeCollection @entity(immutable: true) {
  id: Bytes!
  user: User!
  feeType: FeeType!
  amount: BigDecimal!
  timestamp: BigInt!
  transactionHash: Bytes!
  feeDestination: Bytes!
}

enum FeeType {
  STAKING_FEE
  UNSTAKING_FEE
  CLAIM_FEE
  PLATFORM_FEE
  PERFORMANCE_FEE
}

type UserFeeAnalytics @entity(immutable: false) {
  id: Bytes!
  user: User!
  totalFeespaid: BigDecimal!
  stakingFees: BigDecimal!
  claimFees: BigDecimal!
  lastFeePayment: BigInt!
}

# NEW: APY tracking
type APYSnapshot @entity(immutable: true) {
  id: Bytes!
  date: BigInt!
  currentAPY: BigDecimal!
  currentAPR: BigDecimal!
  totalStakedValue: BigDecimal!
  rewardRate: BigDecimal!
  participationRate: BigDecimal!
  averageStakingDuration: BigDecimal!
}

# Enhanced platform stats
type PlatformStats @entity(immutable: false) {
  id: Bytes!
  totalNFTsMinted: Int!
  totalNFTsStaked: Int!
  totalUsers: Int!
  totalStakers: Int!
  totalRewardsDistributed: BigDecimal!
  currentRewardRate: BigDecimal!
  totalETHReceived: BigDecimal!

  # NEW: Enhanced stats
  currentAPY: BigDecimal!
  currentAPR: BigDecimal!
  averageStakingDuration: BigDecimal!
  participationRate: BigDecimal!

  lastUpdated: BigInt!
}

# Existing entities (unchanged)
type StakeEvent @entity(immutable: true) {
  id: Bytes!
  nft: FounderNFT!
  user: User!
  action: StakeAction!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
  rewardPerTokenAtTime: BigDecimal
}

type RewardClaim @entity(immutable: true) {
  id: Bytes!
  nft: FounderNFT!
  user: User!
  amount: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum StakeAction {
  STAKE
  UNSTAKE
}

type RewardRate @entity(immutable: false) {
  id: Bytes!
  oldRate: BigDecimal!
  newRate: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type DailySnapshot @entity(immutable: true) {
  id: Bytes!
  date: BigInt!
  totalStaked: Int!
  totalStakers: Int!
  totalUsers: Int!
  rewardsDistributed: BigDecimal!
  newStakers: Int!
  newUsers: Int!
  averageStakingDuration: BigDecimal!
  rewardRate: BigDecimal!
}

type ETHReceived @entity(immutable: true) {
  id: Bytes!
  from: Bytes!
  amount: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}
