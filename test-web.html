<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real World Projects - Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #7928CA, #FF0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 1.2rem;
      color: #666;
    }
    .actions {
      margin: 20px 0;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background-color: #4C1D95;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #6D28D9;
      transform: translateY(-2px);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      background: white;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #4C1D95;
      font-size: 1.3rem;
    }
    .card p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 15px;
    }
    .badge {
      display: inline-block;
      background-color: #F3E8FF;
      color: #7E22CE;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: #E9D5FF;
      border-radius: 5px;
      margin: 15px 0;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background: linear-gradient(90deg, #7C3AED, #C026D3);
      border-radius: 5px;
    }
    #loading {
      text-align: center;
      font-size: 1.5rem;
      color: #666;
      margin-top: 50px;
    }
    footer {
      text-align: center;
      margin-top: 50px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Real World Projects</h1>
    <p class="subtitle">Blockchain-Powered Crowdfunding Platform</p>
  </header>
  
  <div class="actions">
    <button id="loadFeatured">Show Featured Projects</button>
    <button id="loadTrending">Show Trending Projects</button>
    <button id="resetDb">Reset Database</button>
  </div>

  <div id="loading" style="display: none;">Loading projects...</div>
  <div id="projects" class="grid"></div>

  <footer>
    <p>Powered by Blockchain Technology • Transparent Funding • Secure Transactions</p>
  </footer>

  <script>
    // Use the current origin for API requests in Replit
    const API_BASE = window.location.origin + '/api';
    const projectsContainer = document.getElementById('projects');
    const loadingEl = document.getElementById('loading');

    function showLoading(show = true) {
      loadingEl.style.display = show ? 'block' : 'none';
    }

    async function fetchAPI(endpoint, method = 'GET', body = null) {
      try {
        const options = {
          method,
          headers: {
            'Content-Type': 'application/json'
          }
        };

        if (body) {
          options.body = JSON.stringify(body);
        }

        const response = await fetch(`${API_BASE}${endpoint}`, options);
        const data = await response.json();
        return data;
      } catch (error) {
        console.error(`Error: ${error.message}`);
        return null;
      }
    }

    function calculatePercentage(current, goal) {
      return Math.min(Math.round((current / goal) * 100), 100);
    }

    function formatCurrency(amount, currency = 'USD') {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency,
        maximumFractionDigits: 0
      }).format(amount);
    }

    function displayProjects(projects) {
      projectsContainer.innerHTML = '';
      
      if (!projects || projects.length === 0) {
        projectsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No projects found</p>';
        return;
      }

      projects.forEach(project => {
        const percentage = calculatePercentage(project.currentFunding, project.fundingGoal);
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${project.thumbnailUrl}" alt="${project.title}">
          <div class="card-content">
            <h3>${project.title}</h3>
            <p>${project.shortDescription || project.description.substring(0, 100) + '...'}</p>
            <div class="progress-bar">
              <div class="progress" style="width: ${percentage}%"></div>
            </div>
            <div class="card-meta">
              <span>${formatCurrency(project.currentFunding)} raised</span>
              <span>${project.daysRemaining || project.daysLeft} days left</span>
            </div>
            <div class="card-meta">
              <span>${project.backerCount} backers</span>
              <span class="badge">${project.fundingCurrency || 'USD'}</span>
            </div>
          </div>
        `;
        projectsContainer.appendChild(card);
      });
    }

    async function loadFeaturedProjects() {
      showLoading();
      const projects = await fetchAPI('/projects/featured');
      displayProjects(projects);
      showLoading(false);
    }

    async function loadTrendingProjects() {
      showLoading();
      const projects = await fetchAPI('/projects/trending');
      displayProjects(projects);
      showLoading(false);
    }

    async function resetDatabase() {
      showLoading();
      const result = await fetchAPI('/reset', 'POST');
      console.log('Database reset result:', result);
      showLoading(false);
      
      if (result && result.stats) {
        alert(`Database reset successfully!\nCategories: ${result.stats.categories}\nProjects: ${result.stats.projects}\nFeatured Projects: ${result.stats.featuredProjects}`);
        loadFeaturedProjects();
      } else {
        alert('Error resetting database. Check console for details.');
      }
    }

    // Event listeners
    document.getElementById('loadFeatured').addEventListener('click', loadFeaturedProjects);
    document.getElementById('loadTrending').addEventListener('click', loadTrendingProjects);
    document.getElementById('resetDb').addEventListener('click', resetDatabase);

    // Load featured projects on page load
    window.addEventListener('DOMContentLoaded', loadFeaturedProjects);
  </script>
</body>
</html>
